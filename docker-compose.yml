version: "3.9"

services:
  frontend:
    build: ./ecommerce-frontend
    container_name: ecommerce-frontend
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=${REACT_APP_API_URL}
    volumes:
      - ./ecommerce-frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend
    restart: always

  backend:
    build: ./ecommerce-backend
    container_name: ecommerce-backend
    ports:
      - "5000:5000"
    volumes:
      - ./ecommerce-backend/uploads:/app/uploads   # <-- IMPORTANT FIX
    environment:
      - PORT=5000
      - PGHOST=postgres
      - PGUSER=ecommerce_user
      - PGPASSWORD=mousin
      - PGDATABASE=ecommerce
      - PGPORT=5432
    depends_on:
      - postgres
    restart: always

  postgres:
    image: postgres:15
    container_name: ecommerce-postgres
    restart: always
    environment:
      - POSTGRES_USER=ecommerce_user
      - POSTGRES_PASSWORD=mousin
      - POSTGRES_DB=ecommerce
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: ecommerce-pgadmin
    restart: always
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@admin.com
      - PGADMIN_DEFAULT_PASSWORD=admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  pgdata:

